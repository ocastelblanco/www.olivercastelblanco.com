service: ocastelblanco-com
frameworkVersion: '4'

plugins:
  - serverless-domain-manager

custom:
  customDomain:
    domainName: api.ocastelblanco.com
    apiType: http
    endpointType: regional
    stage: ${sls:stage}
    createRoute53Record: true

provider:
  name: aws
  runtime: nodejs24.x
  region: us-east-1
  memorySize: 512
  timeout: 15
  environment:
    NODE_ENV: production
    NG_ALLOWED_HOSTS: '*.lambda-url.us-east-1.on.aws'
  httpApi:
    cors:
      allowedOrigins:
        - 'https://ocastelblanco.com'
      allowedHeaders:
        - 'Content-Type'
      allowedMethods:
        - POST
        - OPTIONS
      maxAge: 86400

build:
  esbuild:
    bundle: true
    minify: false
    target: node24
    platform: node
    format: cjs
    external:
      - './dist/ocastelblanco/server/server.mjs'

functions:
  app:
    handler: lambda-handler.handler
    url:
      cors: true
  contact:
    handler: src/lambda/contact-handler.handler
    events:
      - httpApi:
          path: /contact
          method: POST

package:
  individually: false
  patterns:
    - '!**'
    - 'dist/ocastelblanco/**'
