name: Deploy to AWS Lambda

# Flujo por ambientes (ADR-013): abrir/actualizar un PR contra `main`
# despliega `preview`; un merge a `main` (push) despliega `production`. Sin
# trigger `push` sobre feature branches — todo cambio pasa por PR
# (CLAUDE.md, ciclo de vida de un cambio).
on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main

jobs:
  deploy-preview:
    name: Build & Deploy (preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # `npm run build` (sin --configuration) resolvería a la config de
        # producción por defecto, apuntando al dominio y contenido equivocados.
        run: npm run build:preview

      - name: Deploy
        id: deploy
        run: |
          set +e
          npx serverless deploy --stage preview --verbose 2>&1 | tee /tmp/sls-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Serverless deploy failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          URL=$(grep -oP 'https://[a-z0-9]+\.lambda-url\.[a-z0-9-]+\.on\.aws[^\s]*' /tmp/sls-output.txt | head -1)
          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "## 🚀 Preview URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**[$URL]($URL)**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "PR: #${{ github.event.pull_request.number }} (\`${{ github.head_ref }}\`)" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
          LAB_PUBLISH_TOKEN: ${{ secrets.LAB_PUBLISH_TOKEN }}

  deploy-production:
    name: Build & Deploy (production)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        # Configuración `production` por defecto (defaultConfiguration en
        # angular.json) — apunta a api.ocastelblanco.com y /content/lab.json.
        run: npm run build

      - name: Deploy
        id: deploy
        run: |
          set +e
          npx serverless deploy --stage production --verbose 2>&1 | tee /tmp/sls-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Serverless deploy failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "## 🚀 Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
          LAB_PUBLISH_TOKEN: ${{ secrets.LAB_PUBLISH_TOKEN }}

      # `serverless deploy` solo actualiza el Lambda de SSR — el bundle del navegador
      # (JS/CSS con hash) se sirve aparte desde S3 detrás de CloudFront (ADR-012). Sin
      # este paso, el HTML servido por el Lambda referencia hashes que nunca llegan al
      # bucket: el navegador recibe un fallback con Content-Type equivocado para esos
      # archivos y, por `X-Content-Type-Options: nosniff`, ningún JS del cliente llega a
      # ejecutarse (afecta a cualquier sección que dependa de hidratación, ej. The Lab).
      # `--exclude "content/*"` evita pisar el contenido de Lab, que gestiona por separado
      # el Lambda `lab` (POST /lab → S3, ver serverless.yml).
      - name: Sync static assets to S3
        run: |
          aws s3 sync dist/ocastelblanco/browser s3://ocastelblanco-cdn-production \
            --exclude "content/*" \
            --cache-control "public, max-age=31536000, immutable"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      # Invalida la caché de CloudFront: sin esto, un path que ya devolvió error antes de
      # que este paso existiera (ej. un `main-*.js` servido en 404 y cacheado por el
      # ErrorCachingMinTTL de la distribución) seguiría sirviendo la respuesta vieja pese a
      # que el objeto correcto ya está en S3. No modifica la distribución (`E1MX0LNEKZOG8H`,
      # CLAUDE.md), solo purga su caché — mismo tipo de operación usada en el incidente del
      # switch (MEMORY.md, 2026-08-04).
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1MX0LNEKZOG8H \
            --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
