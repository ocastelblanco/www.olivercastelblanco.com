# Actualizaciones automáticas de dependencias (CLAUDE.md §6, A08).
# Agrupadas para no abrir un PR por paquete; cada PR sigue el flujo normal
# (preview → revisión humana → merge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns:
          - '@angular/*'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      dev-tooling:
        dependency-type: development
        exclude-patterns:
          - '@angular/*'
    ignore:
      # @angular/build exige typescript >=6.0 <6.1; revisar manualmente
      # cuando Angular soporte la siguiente mayor.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # Los tipos deben coincidir con el runtime (Node 24, ver `engines`).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'chore(ci)'
