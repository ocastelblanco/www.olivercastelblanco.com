<section class="lab">
  <header class="lab__header">
    <p class="lab__eyebrow technical-label">{{ trans.t('lab.eyebrow') }}</p>
    <h1 class="lab__title">{{ trans.t('lab.title') }}</h1>
    <p class="lab__subtitle body-md">{{ trans.t('lab.subtitle') }}</p>
  </header>

  <ul class="lab__list" role="list">
    @for (entry of content.labEntries(); track entry.id) {
      <li class="lab__card">
        <div class="lab__card-meta">
          @for (tag of entry.tags; track tag) {
            <span class="lab__card-tag technical-label">{{ tag }}</span>
          }
          <span class="lab__card-date technical-label">{{ entry.fecha }}</span>
        </div>
        <div class="lab__card-body body-md" [innerHTML]="renderTexto(entry)"></div>
      </li>
    }
  </ul>
</section>
