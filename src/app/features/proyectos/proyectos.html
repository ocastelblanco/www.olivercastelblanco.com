<section class="proyectos">
  <header class="proyectos__header">
    <h1 class="proyectos__title" [innerHTML]="trans.t('nav.projects')"></h1>
  </header>

  <div class="proyectos__grid">
    @for (caso of casos; track caso.slug) {
      <article class="proyectos__card">
        <div class="proyectos__card-metric">
          <span class="proyectos__metric-value">{{ content.resolve(caso.metric) }}</span>
          <span class="proyectos__metric-label technical-label">{{ content.resolve(caso.metricLabel) }}</span>
        </div>
        <div class="proyectos__card-content">
          <span class="proyectos__card-tag technical-label">{{ content.resolve(caso.tag) }}</span>
          <h2 class="proyectos__card-title">{{ caso.title }}</h2>
          <p class="proyectos__card-narrative" [innerHTML]="content.resolveMarkdown(caso.narrative)"></p>
          <p class="proyectos__card-stack technical-label" [innerHTML]="content.resolveMarkdown(caso.stack)"></p>
          <a class="proyectos__card-link technical-label" [routerLink]="'/proyectos/' + caso.slug">
            {{ trans.t('proyectos.view_case') }}
          </a>
        </div>
      </article>
    }
  </div>
</section>
